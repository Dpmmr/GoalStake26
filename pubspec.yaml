name: goalstake26
description: "GOALSTAKE 26 - FIFA World Cup 2026 Betting Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase (Database + Auth + Realtime + Storage)
  supabase_flutter: ^2.8.0

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # UI & Design
  google_fonts: ^6.2.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.0
  flutter_staggered_animations: ^1.1.0

  # Utilities
  intl: ^0.19.0
  http: ^1.6.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.0
  uuid: ^4.5.0
  csv: ^5.1.0
  path_provider: ^2.1.0

  # Icons
  feather_icons: ^1.0.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts loaded via google_fonts package at runtime
